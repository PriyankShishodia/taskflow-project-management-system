services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      DB_FILE: /app/data/app.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - taskflow-data:/app/data
    restart: unless-stopped
volumes:
  taskflow-data:
